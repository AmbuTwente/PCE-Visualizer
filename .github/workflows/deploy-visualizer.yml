name: Visualizer bouwen en deployen naar Bunny.net

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/deploy-visualizer.yml'
  workflow_dispatch:

concurrency:
  group: deploy-visualizer
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Bouwen en deployen naar Bunny Storage
    runs-on: ubuntu-latest

    steps:
      - name: Broncode ophalen
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Node.js instellen
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Dependencies installeren
        run: npm ci

      - name: Visualizer bouwen
        run: npm run build

      - name: Controleer dist inhoud
        run: ls -la dist/ && echo "--- index.html inhoud ---" && cat dist/index.html

      # Gehashte assets (index-<hash>.js, icon-chunks, ...) zijn immutable: de
      # bestandsnaam verandert zodra de inhoud verandert. Die mogen daarom lang
      # gecachet worden. graph.json wordt door de generate-graph workflow beheerd
      # en met --exclude buiten --delete gehouden, zodat een visualizer-deploy
      # de laatst gegenereerde graaf niet weggooit.
      - name: Assets synchroniseren naar Bunny Storage (S3)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BUNNY_STORAGE_ZONE }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_ACCESS_KEY }}
          AWS_DEFAULT_REGION: de
        run: |
          aws configure set default.s3.addressing_style path
          aws s3 sync dist/ s3://${{ secrets.BUNNY_STORAGE_ZONE }}/ \
            --endpoint-url ${{ secrets.BUNNY_STORAGE_ENDPOINT }} \
            --delete \
            --exact-timestamps \
            --no-progress \
            --exclude "graph.json" \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      # index.html heeft een stabiele naam en verwijst naar de gehashte assets.
      # Korte cache (60s) zodat de browser snel een nieuwe deploy oppikt zonder
      # dat de gebruiker hard hoeft te refreshen.
      - name: index.html geforceerd overschrijven (korte cache)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BUNNY_STORAGE_ZONE }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_ACCESS_KEY }}
          AWS_DEFAULT_REGION: de
        run: |
          aws s3 cp dist/index.html \
            s3://${{ secrets.BUNNY_STORAGE_ZONE }}/index.html \
            --endpoint-url ${{ secrets.BUNNY_STORAGE_ENDPOINT }} \
            --no-progress \
            --cache-control "public, max-age=60, must-revalidate"

      - name: Bunny CDN cache purgen
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULL_ZONE_ID: ${{ secrets.BUNNY_PULL_ZONE_ID }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.bunny.net/pullzone/${BUNNY_PULL_ZONE_ID}/purgeCache" \
            -H "AccessKey: ${BUNNY_API_KEY}" \
            -H "Content-Type: application/json")
          echo "Bunny purge status: ${STATUS}"
