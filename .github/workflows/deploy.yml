name: PCE Visualizer bouwen en deployen

on:
  schedule:
    - cron: '0 12 * * *'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  generate-graph:
    name: Graph genereren en uploaden
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Visualizer broncode ophalen
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: PCE-PoC modules ophalen
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: yieldersaxion2026/PCE-PoC
          path: pce-poc
          token: ${{ secrets.PCE_POC_TOKEN }}

      - name: Node.js instellen
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Graph genereren
        run: node scripts/generate-graph.mjs
        env:
          MODULES_DIR: ${{ github.workspace }}/pce-poc/modules

      - name: graph.json tonen
        run: cat public/graph.json

      - name: graph.json uploaden naar Bunny Storage (S3)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BUNNY_STORAGE_ZONE }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          AWS_DEFAULT_REGION: de
        run: |
          aws s3 cp public/graph.json \
            s3://${{ secrets.BUNNY_STORAGE_ZONE }}/graph.json \
            --endpoint-url ${{ secrets.BUNNY_S3_ENDPOINT }} \
            --no-progress \
            --cache-control "public, max-age=60, must-revalidate"

      - name: Visualizer URL tonen
        run: cat public/graph-url.txt

  deploy-visualizer:
    name: Visualizer bouwen en deployen
    runs-on: ubuntu-latest
    needs: [generate-graph]
    if: |
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (needs.generate-graph.result == 'success' || needs.generate-graph.result == 'skipped')

    steps:
      - name: Broncode ophalen
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Node.js instellen
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Dependencies installeren
        run: npm ci

      - name: Visualizer bouwen
        run: npm run build

      - name: Controleer dist inhoud
        run: ls -la dist/ && echo "--- index.html inhoud ---" && cat dist/index.html

      # Gehashte assets (index-<hash>.js, icon-chunks, ...) zijn immutable.
      # graph.json wordt door generate-graph beheerd en uitgesloten van --delete.
      - name: Assets synchroniseren naar Bunny Storage (S3)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BUNNY_STORAGE_ZONE }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          AWS_DEFAULT_REGION: de
        run: |
          aws s3 sync dist/ s3://${{ secrets.BUNNY_STORAGE_ZONE }}/ \
            --endpoint-url ${{ secrets.BUNNY_S3_ENDPOINT }} \
            --delete \
            --exact-timestamps \
            --no-progress \
            --exclude "graph.json" \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: index.html uploaden (korte cache)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BUNNY_STORAGE_ZONE }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          AWS_DEFAULT_REGION: de
        run: |
          aws s3 cp dist/index.html \
            s3://${{ secrets.BUNNY_STORAGE_ZONE }}/index.html \
            --endpoint-url ${{ secrets.BUNNY_S3_ENDPOINT }} \
            --no-progress \
            --cache-control "public, max-age=60, must-revalidate"

      - name: Bunny CDN cache purgen
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULLZONE_ID: ${{ secrets.BUNNY_PULLZONE_ID }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.bunny.net/pullzone/${BUNNY_PULLZONE_ID}/purgeCache" \
            -H "AccessKey: ${BUNNY_API_KEY}" \
            -H "Content-Type: application/json")
          echo "Bunny purge status: ${STATUS}"
