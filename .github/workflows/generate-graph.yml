name: Bicep graph genereren en deployen

on:
  # Dagelijks om 12:00 UTC (14:00 Nederlandse zomertijd)
  schedule:
    - cron: '0 12 * * *'
  # Handmatig starten via GitHub Actions → "Run workflow"
  workflow_dispatch:

concurrency:
  group: generate-graph
  cancel-in-progress: true

jobs:
  generate:
    name: Graph genereren en deployen
    runs-on: ubuntu-latest

    steps:
      - name: Visualizer broncode ophalen
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: PCE-PoC modules ophalen
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: yieldersaxion2026/PCE-PoC
          path: pce-poc
          token: ${{ secrets.PCE_POC_TOKEN }}

      - name: Node.js instellen
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Graph genereren
        run: node scripts/generate-graph.mjs
        env:
          MODULES_DIR: ${{ github.workspace }}/pce-poc/modules

      - name: graph.json tonen
        run: cat public/graph.json

      - name: graph.json uploaden naar Bunny Storage (S3)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BUNNY_STORAGE_ZONE }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
          AWS_DEFAULT_REGION: de
        run: |
          aws s3 cp public/graph.json \
            s3://${{ secrets.BUNNY_STORAGE_ZONE }}/graph.json \
            --endpoint-url ${{ secrets.BUNNY_S3_ENDPOINT }} \
            --no-progress \
            --cache-control "public, max-age=60, must-revalidate"

      - name: Visualizer URL tonen
        run: cat public/graph-url.txt
