name: Site publiceren op GitHub Pages

# Draait alleen als je er zelf op drukt, en staat er voor wie deze repository
# als template gebruikt en de visualizer als website wil tonen.
#
# GitHub Pages is gratis en heeft geen externe hosting of API-sleutels nodig.
# Dat is bewust: de originele opzet publiceerde naar een betaald CDN, en juist
# die maandelijkse rekening was de reden om dit project te archiveren.
#
# Eenmalig instellen:
#   1. Settings > Pages > Build and deployment > Source: "GitHub Actions".
#   2. Zet "site.basePath" in visualizer.config.json op "/<repository-naam>/",
#      want een projectsite draait niet op de root van het domein.
#   3. Vul "site.url" in met de URL die GitHub je geeft.
#   4. Start deze workflow.
#
# Voor het PCE-project staat Pages uit: het project is afgerond en er hoort
# geen live site meer te draaien.
on:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    name: Bouwen en publiceren
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Broncode ophalen
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Node.js instellen
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Controleren of basePath is ingevuld
        run: |
          BASE=$(jq -r '.site.basePath' visualizer.config.json)
          if [ "$BASE" = "/" ]; then
            echo "::warning::site.basePath staat op \"/\". Op een GitHub Pages projectsite hoort hier \"/${{ github.event.repository.name }}/\" te staan, anders laden de assets niet."
          fi

      - name: Dependencies installeren
        run: npm ci

      - name: Visualizer bouwen
        run: npm run build

      # De onderstaande drie actions zijn niet op een SHA vastgezet, in
      # tegenstelling tot de rest van deze repository. Laat Renovate ze
      # vastzetten en bijwerken, of doe dat handmatig voordat je ze vertrouwt.
      - name: Pages voorbereiden
        uses: actions/configure-pages@v5

      - name: Bouwresultaat uploaden
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publiceren
        id: deployment
        uses: actions/deploy-pages@v4
