name: Visualizer CI

# Het project is afgerond en de visualizer wordt niet meer gedeployed, dus deze
# workflow start nergens meer vanzelf op: geen schedule, geen push, geen pull
# request. Hij blijft staan als handmatige check, zodat wie de archiefversie ooit
# weer lokaal wil draaien eerst kan zien of de build het nog doet.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Visualizer valideren (geen deploy)
    runs-on: ubuntu-latest

    steps:
      - name: Broncode ophalen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js instellen
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Dependencies installeren
        run: npm ci

      - name: Visualizer bouwen
        run: npm run build

      - name: Controleren of de momentopname nog bij de bevroren graaf past
        run: |
          npm run snapshot
          git diff --exit-code -- docs/graph-snapshot.svg
